name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua 5.3
        run: sudo apt-get update && sudo apt-get install -y lua5.3
      - name: Syntax check
        run: luac5.3 -p src/TheSpikeCross.lua
      - name: Logic tests
        run: lua5.3 tests/run_tests.lua
      - name: Cheat table is up to date
        run: python3 tools/build_ct.py --check
